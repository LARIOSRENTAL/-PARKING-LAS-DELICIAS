<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Las Delicias · Refuerzo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px Arial;background:#eef3f7;color:#172d43;margin:0}header{background:#15314c;color:white;padding:17px}main{max-width:720px;margin:25px auto;padding:18px}.panel{background:white;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 2px 9px #1a34421c}label{display:block;font-weight:bold;margin-top:12px}input:not([type="password"]):not([type="datetime-local"]),textarea{text-transform:uppercase}input,select{width:100%;box-sizing:border-box;padding:13px;font:inherit;border:1px solid #acbdca;border-radius:8px;margin-top:6px}button{background:#15314c;color:white;border:0;border-radius:9px;padding:13px 17px;font-weight:bold;margin:12px 8px 4px 0;cursor:pointer}button:disabled{opacity:.5}.hidden{display:none}.tabs button{background:#cfdde9;color:#17324b}.error{color:#a32020}#result{font-weight:bold;white-space:pre-wrap}@media print{@page{size:80mm auto;margin:3mm}body *{visibility:hidden!important}#ticketWrap,#ticketWrap *{visibility:visible!important}#ticketWrap{display:block!important;position:absolute;left:0;top:0;width:74mm;margin:0;padding:0;background:#fff;color:#111;font:12px Arial,sans-serif}.no-print{display:none!important}}</style></head><body><header><strong>LAS DELICIAS · MODO REFUERZO</strong></header><main><div class="panel" id="login"><h2>Acceso de refuerzo</h2><p>Introduce la clave fija de acceso. La sesión dura 8 horas. Sin acceso a cobros ni salidas.</p><label>Clave de acceso<input id="code" type="password" inputmode="numeric" maxlength="1" autocomplete="off"></label><button onclick="enter()">Entrar como refuerzo</button><p id="loginError" class="error"></p></div><div id="work" class="hidden"><div class="tabs"><button onclick="tab('rotation')">Dar entrada · Rotación</button><button onclick="tab('stay')">Nueva estancia</button><button onclick="location.href='index.html'">Salir</button></div><div class="panel" id="rotation"><h2>Dar entrada en Rotación</h2><label>Matrícula<input id="plate" autocomplete="off"></label><label>Tarifa<select id="tariff"></select></label><label>Plaza<select id="spot"><option value="">Selecciona plaza libre</option></select></label><label>Cliente / observaciones<input id="client"></label><button id="enterButton" onclick="rotationEntry()">Registrar entrada e imprimir ticket</button></div><div class="panel hidden" id="stay"><h2>Crear estancia pendiente de cobro</h2><label>Tipo de vehículo<select id="type"></select></label><label>Matrícula<input id="stayPlate"></label><label>Marca / modelo<input id="model"></label><label>Fecha y hora de entrada<input id="start" type="datetime-local"></label><label>Días<select id="days"></select></label><label>Nombre del cliente (opcional)<input id="name"></label><button id="stayButton" onclick="createStay()">Crear reserva sin cobrar</button></div><div class="panel" id="result" role="status"></div></div><div id="ticketWrap" class="hidden"><div id="ticket"></div></div></main><script src="https://cdn.jsdelivr.net/npm/qz-tray@2.3.0/qz-tray.js"></script><script src="assets/jsbarcode-code128.min.js"></script><script src="print-profiles.js?v=complete-20261026"></script><script src="office-print.js?v=complete-20261026"></script><script src="entry-ticket.js?v=complete-20261026"></script><script src="reinforcement.js?v=production-20261101"></script></body></html>
